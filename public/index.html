<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BET SCORES — Ligues</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">⚽ <span>BET</span>SCORES</div>
      <div class="header-sub">Sélection de la ligue</div>
    </div>
  </header>

  <main class="leagues-main">
    <div class="leagues-container">
      <div class="leagues-header">
        <h1 class="leagues-title">Mes ligues</h1>
        <button type="button" id="btnNewLeague" class="btn-new-league">+ Nouvelle ligue</button>
      </div>
      <div id="leaguesList"></div>
    </div>
  </main>

  <!-- Modale : créer / renommer une ligue -->
  <div id="leagueModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="leagueModalTitle">Nouvelle ligue</h3>
        <button type="button" id="leagueModalClose" class="modal-close">✕</button>
      </div>
      <form id="leagueForm">
        <div class="field">
          <label for="leagueName">Nom de la ligue</label>
          <input type="text" id="leagueName" placeholder="ex : Premier League" required />
        </div>
        <div class="field">
          <label for="leagueNbJournees">Nombre de journées</label>
          <input type="number" id="leagueNbJournees" min="1" max="100" value="38" required />
        </div>
        <input type="hidden" id="leagueEditId" />
        <div id="leagueFormMsg" class="msg hidden"></div>
        <button type="submit" id="leagueFormSubmit">Créer la ligue</button>
      </form>
    </div>
  </div>

  <!-- Modale : gérer les équipes -->
  <div id="teamsModal" class="modal-overlay hidden">
    <div class="modal modal-teams">
      <div class="modal-header">
        <h3 id="teamsModalTitle">Équipes</h3>
        <button type="button" id="teamsModalClose" class="modal-close">✕</button>
      </div>
      <input type="hidden" id="teamsLeagueId" />
      <div id="teamsList" class="teams-list"></div>
      <form id="addTeamForm" class="add-team-form">
        <div class="add-team-row">
          <input type="text" id="newTeamName" placeholder="Nom de l'équipe" required />
          <select id="newTeamLevel">
            <option value="">-- Niveau --</option>
            <option value="fort">Fort</option>
            <option value="moyen">Moyen</option>
            <option value="faible">Faible</option>
          </select>
          <button type="submit" class="btn-add-team">+ Ajouter</button>
        </div>
        <div id="addTeamMsg" class="msg hidden"></div>
      </form>
    </div>
  </div>

  <script src="js/leagues.js"></script>
</body>
</html>
